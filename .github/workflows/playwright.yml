name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Install Allure CLI
      if: ${{ !cancelled() }}
      run: npm install -g allure-commandline
    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: allure generate allure-results -o allure-report --clean
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Publish test results to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: test-results/${{ github.run_number }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
    - name: Publish Allure Report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        destination_dir: allure-report/${{ github.run_number }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
    - name: Comment on PR with test results
      if: ${{ github.event_name == 'pull_request' && !cancelled() }}
      uses: daun/playwright-report-comment@v3
      with:
        report-file: playwright-report/index.html
    - name: Add deployment summary
      if: ${{ !cancelled() }}
      run: |
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        PW_REPORT_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/test-results/${{ github.run_number }}"
        ALLURE_REPORT_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/allure-report/${{ github.run_number }}"
        
        echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Test results have been successfully published!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 Access Your Reports" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Playwright Report:**" >> $GITHUB_STEP_SUMMARY
        echo "[🎭 View Playwright Report](${PW_REPORT_URL})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Allure Report:**" >> $GITHUB_STEP_SUMMARY
        echo "[📈 View Allure Report](${ALLURE_REPORT_URL})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Run Artifacts:**" >> $GITHUB_STEP_SUMMARY
        echo "[📦 View in Run Summary](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
        PW_STATUS="❌"
        ALLURE_STATUS="❌"
        if [ -f playwright-report/index.html ]; then
          PW_STATUS="✓"
        fi
        if [ -f allure-report/index.html ]; then
          ALLURE_STATUS="✓"
        fi
        echo "${PW_STATUS} Playwright report generated" >> $GITHUB_STEP_SUMMARY
        echo "${ALLURE_STATUS} Allure report generated" >> $GITHUB_STEP_SUMMARY
        echo "- Playwright: \`test-results/${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Allure: \`allure-report/${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: \`gh-pages\`" >> $GITHUB_STEP_SUMMARY
        echo "- Run Number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
