name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Setup Java for Allure
      if: always()
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Generate Allure Report
      if: always()
      run: npx allure generate allure-results -o allure-report --clean 2>&1 || echo "Allure generation failed, but continuing..."
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          playwright-report/
          allure-report/
        retention-days: 30
    - name: Publish reports to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        keep_files: true
    - name: Add summary
      if: always()
      run: |
        REPO="${{ github.repository }}"
        RUN_ID="${{ github.run_id }}"
        RUN_NUMBER="${{ github.run_number }}"
        
        echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Reports Generated" >> $GITHUB_STEP_SUMMARY
        echo "- 📄 **Playwright Report**: Available in [Artifacts](https://github.com/${REPO}/actions/runs/${RUN_ID})" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 **Allure Report**: Available in [Artifacts](https://github.com/${REPO}/actions/runs/${RUN_ID})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Run Information" >> $GITHUB_STEP_SUMMARY
        echo "- Run Number: ${RUN_NUMBER}" >> $GITHUB_STEP_SUMMARY
        echo "- Repository: ${REPO}" >> $GITHUB_STEP_SUMMARY
