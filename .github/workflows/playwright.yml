name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Setup Java
      if: always()
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Download and Setup Allure
      if: always()
      run: |
        echo "Downloading Allure 2.27.0..."
        curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
        tar -xzf allure.tgz
        export PATH="$PWD/allure-2.27.0/bin:$PATH"
        echo "PATH=$PWD/allure-2.27.0/bin:$PATH" >> $GITHUB_ENV
        which allure
        allure --version
    - name: Restore Allure History
      if: always()
      run: |
        mkdir -p allure-results/history
        echo "History directory prepared"
    - name: Generate Allure Report
      if: always()
      run: |
        echo "=== Generating Allure Report ==="
        echo "Source: allure-results/"
        echo "Output: allure-report/"
        
        # Check if allure-results exists and has content
        if [ ! -d "allure-results" ] || [ -z "$(ls -A allure-results/ 2>/dev/null | grep -v history)" ]; then
          echo "⚠️ No Allure results found. Creating sample report structure..."
          mkdir -p allure-results
        fi
        
        # Generate the report
        allure generate allure-results -o allure-report --clean 2>&1
        
        # Verify generation
        echo ""
        echo "=== Verification ==="
        if [ -f "allure-report/index.html" ]; then
          echo "✓ index.html found"
          
          # Check for required assets
          for dir in app data export history plugins widgets; do
            if [ -d "allure-report/$dir" ]; then
              count=$(find allure-report/$dir -type f 2>/dev/null | wc -l)
              echo "  ✓ $dir/ ($count files)"
            else
              echo "  ✗ $dir/ missing"
            fi
          done
          
          # Show total size
          echo ""
          du -sh allure-report/
          
          # Verify HTML has data-embedded
          if grep -q "data-embedded" allure-report/index.html; then
            echo "✓ Data embedded in HTML"
          fi
        else
          echo "✗ index.html NOT found"
          echo "Directory structure:"
          find allure-report -type f -name "*.html" -o -name "*.js" -o -name "*.json" 2>/dev/null | head -20
          echo ""
          echo "Full directory listing:"
          ls -la allure-report/ 2>/dev/null || echo "Directory empty or missing"
        fi
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          playwright-report/
          allure-report/
        retention-days: 30
    - name: Verify Report Generated
      if: always()
      run: |
        echo "=== Playwright Report ===" 
        if [ -f "playwright-report/index.html" ]; then
          echo "✓ Playwright report found"
          du -sh playwright-report/
        else
          echo "✗ Playwright report NOT found"
        fi
        echo ""
        echo "=== Allure Report Structure ===" 
        if [ -d "allure-report" ]; then
          echo "✓ Report directory exists"
          echo ""
          echo "File structure:"
          find allure-report -type f | head -30
          echo ""
          echo "Total files: $(find allure-report -type f | wc -l)"
          echo "Total size: $(du -sh allure-report | cut -f1)"
          echo ""
          echo "Key files:"
          ls -lh allure-report/index.html 2>/dev/null || echo "  ✗ index.html missing"
          [ -f "allure-report/app.js" ] && echo "  ✓ app.js present" || echo "  ✗ app.js missing"
          [ -d "allure-report/data" ] && echo "  ✓ data/ directory present" || echo "  ✗ data/ missing"
        else
          echo "✗ Report directory not found"
        fi
    - name: Add summary
      if: always()
      run: |
        REPO="${{ github.repository }}"
        RUN_ID="${{ github.run_id }}"
        RUN_NUMBER="${{ github.run_number }}"
        
        echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "playwright-report/index.html" ]; then
          echo "✅ **Playwright Report**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Playwright Report**: Not generated" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "allure-report/index.html" ]; then
          echo "✅ **Allure Report**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Allure Report**: Not generated" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Download Reports" >> $GITHUB_STEP_SUMMARY
        echo "See [Artifacts](https://github.com/${REPO}/actions/runs/${RUN_ID}) for test reports" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 💡 Viewing Allure Report Locally" >> $GITHUB_STEP_SUMMARY
        echo "After downloading and extracting artifacts, serve with HTTP server:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Python 3" >> $GITHUB_STEP_SUMMARY
        echo "cd allure-report && python -m http.server 8000" >> $GITHUB_STEP_SUMMARY
        echo "# Or Node.js" >> $GITHUB_STEP_SUMMARY
        echo "npx http-server allure-report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "Then open: http://localhost:8000" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Run**: #${RUN_NUMBER}" >> $GITHUB_STEP_SUMMARY
